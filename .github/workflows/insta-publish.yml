name: Instagram 예약 게시

on:
  schedule:
    - cron: "7 * * * *"     # 매시 7분(UTC) 실행 → 예약시간(KST)이 지난 승인 게시물 업로드
  workflow_dispatch:
    inputs:
      dry_run:
        description: "업로드 없이 대상만 확인"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram/requirements.txt
      - run: pip install -r instagram/requirements.txt
      - name: 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.facebook.com' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python instagram/scripts/publish.py
      - name: 게시 기록 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/published.json
          git diff --cached --quiet || (git commit -m "chore(instagram): 게시 기록 업데이트" && git pull --rebase && git push)
