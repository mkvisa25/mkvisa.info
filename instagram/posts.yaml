        items:
          - ko: "학교·입학 학기 선택"
            mn: "Сургууль, элсэх улирлаа сонгох"
          - ko: "입학 지원서류 제출"
            mn: "Элсэлтийн материал илгээх"
          - ko: "표준입학허가서 발급"
            mn: "Элсэлтийн зөвшөөрөл (표준입학허가서) авах"
          - ko: "사증 신청 (재외공관 또는 비자신청센터)"
            mn: "Элчин сайдын яам эсвэл визийн төвд мэдүүлэх"
          - ko: "입국 후 90일 이내 외국인등록"
            mn: "Ирснээс хойш 90 хоногийн дотор гадаад иргэний бүртгэл"
      - type: list
        style: check
        title: "주요 준비서류"
        title_mn: "Гол бичиг баримт"
        items:
          - ko: "여권"
            mn: "Гадаад паспорт"
          - ko: "최종학력 증명서 (아포스티유)"
            mn: "Сүүлийн боловсролын баримт (апостильтай)"
          - ko: "재정능력 입증서류 (은행 잔고증명 등)"
            mn: "Санхүүгийн баталгаа (банкны үлдэгдлийн тодорхойлолт г.м.)"
          - ko: "가족관계 서류 (부모 후원 시)"
            mn: "Гэр бүлийн лавлагаа (эцэг эх санхүүжүүлэх бол)"
          - ko: "자기소개서 · 학업계획서"
            mn: "Өөрийн танилцуулга, сурах төлөвлөгөө"
        note: "※ 학교·국적별로 서류와 잔고 기준이 다릅니다. 상담 시 학교별 체크리스트를 드립니다."
      - *cta
    caption: |
      🎓 한국 어학연수(D-4) 준비 순서
      학교 선택 → 지원서류 제출 → 표준입학허가서 → 사증 신청 → 입국 후 외국인등록.
      학교마다 서류·잔고 기준이 달라요. 희망 지역·학기·최종학력을 DM으로 알려주세요!

      🎓 Солонгост хэлний бэлтгэл (D-4)
      Сургууль сонгох → материал илгээх → элсэлтийн зөвшөөрөл → виз мэдүүлэх → ирсний дараа бүртгүүлэх.
      Хүссэн хот, улирал, боловсролоо мессежээр бичээрэй!
    hashtags: [*tags, 한국유학, 어학연수, D4비자, СолонгостСуралцах, ХэлнийБэлтгэл]

