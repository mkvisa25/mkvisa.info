# MK VISA Instagram 콘텐츠 캘린더
# ------------------------------------------------------------
# - publish_at : 한국시간(KST) "YYYY-MM-DD HH:MM"
# - approved   : 담당자가 내용(법령·서류 요건)을 검토한 뒤 true 로 바꿔야 업로드됩니다.
# - theme      : navy | light | green
# - slides     : 1~10장. type = cover | list | cta
#     cover : kicker, title, subtitle, subtitle_mn
#     list  : title, title_mn, style(check|number), items[{ko, mn}], note
#     cta   : title, title_mn, lines[], button
# 수정 후 push 하면 GitHub Actions가 이미지를 자동 생성합니다.

brand:
  name: "MK VISA"
  handle: ""          # 예: "@mkvisa_official" (카드 오른쪽 아래에 표시)
  footer: "비자 · 번역/공증 · 유학 상담"

common_cta: &cta
  type: cta
  title: "상담 신청"
  title_mn: "Зөвлөгөө авах"
  lines:
    - "이름 · 연락처 · 현재 비자 · 원하는 업무를 DM으로 보내주세요"
    - "Нэр, утас, визийн төрөл, хүсэлтээ мессежээр бичээрэй"
    - "한국어 · 몽골어 상담 가능"
  button: "DM 보내기 · Мессеж бичих"

hashtags_common: &tags
  - 엠케이비자
  - MKVISA
  - 한국비자
  - 비자대행
  - 몽골
  - Солонгос
  - СолонгосВиз

posts:
